<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 虚拟试衣间</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:20px 16px}
.container{max-width:420px;margin:0 auto}
.header{padding:20px 0;text-align:center;color:#fff}
.header h1{font-size:1.8rem;font-weight:700;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.header p{color:rgba(255,255,255,.8);font-size:.9rem;margin-top:8px}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 40px rgba(0,0,0,.2);margin-bottom:16px;overflow:hidden}
.card-head{padding:20px 20px 0;display:flex;align-items:center;gap:12px}
.card-icon{width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#667eea,#764ba2);display:flex;align-items:center;justify-content:center;font-size:22px;color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.3)}
.card-head h2{font-size:1.15rem;font-weight:600;color:#1a1a1a}
.card-head .sub{font-size:.75rem;color:#888;margin-top:2px}
.card-body{padding:20px}

.upload-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.upload-col{display:flex;flex-direction:column;gap:8px}
.col-title{font-size:.8rem;color:#666;font-weight:600;display:flex;align-items:center;gap:4px}
.upload-slot{position:relative;border:2px dashed #d0d0d0;border-radius:16px;background:#f8f9fa;cursor:pointer;aspect-ratio:3/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;transition:all .3s}
.upload-slot:active{transform:scale(.98)}
.upload-slot.has-image{border-style:solid;border-color:#667eea;background:#fff}
.upload-slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:14px}
.upload-slot .rm{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;border:none;cursor:pointer;font-size:16px;z-index:2;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.upload-slot .tag{position:absolute;bottom:0;left:0;right:0;padding:8px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.7rem;text-align:center;z-index:2}

.category-row{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.cat-btn{padding:10px 18px;border:2px solid #e0e0e0;border-radius:100px;font-size:.8rem;color:#666;background:#fff;cursor:pointer;transition:all .2s;font-weight:500}
.cat-btn.active{border-color:#667eea;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 4px 12px rgba(102,126,234,.3)}

.btn-row{display:flex;gap:12px}
.btn{flex:1;padding:16px 20px;border-radius:14px;font-size:.95rem;font-weight:600;cursor:pointer;border:none;transition:all .3s}
.btn-primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;box-shadow:0 6px 20px rgba(102,126,234,.4)}
.btn-primary:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.btn-primary:not(:disabled):active{transform:translateY(2px)}
.btn-secondary{background:#f0f0f0;color:#666}

.result-area{min-height:320px;display:flex;flex-direction:column}
.result-ph{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#999;padding:60px 20px;text-align:center}
.result-ph .icon{font-size:64px;opacity:.4}
.result-ph p{line-height:1.6}
.result-img-wrap{position:relative;border-radius:16px;overflow:hidden;background:#f0f0f0;box-shadow:0 8px 30px rgba(0,0,0,.1)}
.result-img-wrap img{width:100%;display:block}
.result-actions{display:flex;gap:10px;margin-top:16px}
.result-act{flex:1;padding:14px 16px;border:2px solid #e0e0e0;border-radius:12px;background:#fff;color:#555;font-size:.85rem;font-weight:600;cursor:pointer;text-align:center;transition:all .2s}
.result-act:active{background:#f8f8f8}

.loading-ov{position:absolute;inset:0;background:rgba(255,255,255,.98);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;border-radius:16px;z-index:10}
.loading-sp{width:56px;height:56px;border:4px solid #f0f0f0;border-top-color:#667eea;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:1rem;color:#444;text-align:center;line-height:1.6;font-weight:500}
.loading-txt span{font-size:.85rem;color:#888;display:block;margin-top:8px}

.tip-box{background:linear-gradient(135deg,#fff9e6,#fff3cd);border-radius:12px;padding:14px 16px;margin-top:16px;border-left:4px solid #f0ad4e}
.tip-box-title{font-size:.8rem;font-weight:600;color:#856404;margin-bottom:4px}
.tip-box-text{font-size:.75rem;color:#856404;line-height:1.5}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);padding:14px 24px;border-radius:12px;background:#1a1a1a;color:#fff;font-size:.9rem;text-align:center;z-index:1000;animation:toastIn .3s ease-out;box-shadow:0 8px 30px rgba(0,0,0,.3);white-space:nowrap}
.toast.success{background:#28a745}
.toast.error{background:#dc3545}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(-20px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

.footer{text-align:center;padding:30px 0;font-size:.75rem;color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>🧥 AI 虚拟试衣间</h1>
    <p>上传模特和服装，AI 智能生成试穿效果</p>
  </header>

  <div class="card">
    <div class="card-head">
      <div class="card-icon">📸</div>
      <div>
        <h2>上传照片</h2>
        <div class="sub">选择模特照片和要试穿的服装</div>
      </div>
    </div>
    <div class="card-body">
      <div class="upload-grid">
        <div class="upload-col">
          <div class="col-title">👤 模特照片</div>
          <div class="upload-slot" id="slot-model" onclick="pick('model')">
            <div style="font-size:36px;opacity:.5">🧍</div>
            <div style="font-size:.8rem;color:#888">点击上传</div>
          </div>
        </div>
        <div class="upload-col">
          <div class="col-title">👕 服装照片</div>
          <div class="upload-slot" id="slot-garment" onclick="pick('garment')">
            <div style="font-size:36px;opacity:.5">👔</div>
            <div style="font-size:.8rem;color:#888">点击上传</div>
          </div>
        </div>
      </div>
      
      <div class="category-row">
        <div class="cat-btn active" onclick="selCategory(this,'upper_body')">👔 上装</div>
        <div class="cat-btn" onclick="selCategory(this,'lower_body')">👖 下装</div>
        <div class="cat-btn" onclick="selCategory(this,'dresses')">👗 连衣裙</div>
      </div>
      
      <input type="file" id="fi" accept="image/*" style="display:none">
      
      <div class="btn-row">
        <button class="btn btn-secondary" onclick="reset()">🔄 重置</button>
        <button class="btn btn-primary" id="genBtn" onclick="generate()" disabled>✨ 生成试衣效果</button>
      </div>
      
      <div class="tip-box">
        <div class="tip-box-title">💡 使用提示</div>
        <div class="tip-box-text">上传清晰的模特正面照和服装平铺图，效果最佳。生成过程约需 10-20 秒。</div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <div class="card-icon">✨</div>
      <div>
        <h2>生成结果</h2>
        <div class="sub">AI 智能合成的试穿效果</div>
      </div>
    </div>
    <div class="card-body">
      <div class="result-area" id="resultArea">
        <div class="result-ph" id="resultPh">
          <div class="icon">🪄</div>
          <p>上传照片后点击"生成试衣效果"<br>AI 将为您创建试穿照片</p>
        </div>
        <div id="resultContent" style="display:none;position:relative">
          <div class="loading-ov" id="loadingOv" style="display:none">
            <div class="loading-sp"></div>
            <div class="loading-txt">
              AI 正在生成试衣效果...
              <span>请稍候，约需 10-20 秒</span>
            </div>
          </div>
          <div class="result-img-wrap">
            <img id="resultImg" src="" alt="生成结果">
          </div>
          <div class="result-actions">
            <button class="result-act" onclick="download()">⬇️ 保存图片</button>
            <button class="result-act" onclick="generate()">🔄 重新生成</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="footer">AI Virtual Fitting Room · 完全免费使用</div>
</div>

<script>
const S = { img: {}, category: 'upper_body', busy: false };

// 模拟 AI 生成效果
async function generate() {
  if (!(S.img.model && S.img.garment) || S.busy) return;
  S.busy = true;
  updateBtn();
  
  document.getElementById('resultPh').style.display = 'none';
  document.getElementById('resultContent').style.display = 'block';
  document.getElementById('loadingOv').style.display = 'flex';
  
  try {
    // 模拟 AI 处理时间
    await new Promise(r => setTimeout(r, 3000));
    
    // 创建合成效果
    const resultCanvas = await createTryOnEffect(S.img.model, S.img.garment, S.category);
    const resultUrl = resultCanvas.toDataURL('image/jpeg', 0.9);
    
    document.getElementById('loadingOv').style.display = 'none';
    document.getElementById('resultImg').src = resultUrl;
    showToast('✨ 试衣效果生成成功！', 'success');
    
  } catch (e) {
    console.error(e);
    showToast('生成失败，请重试', 'error');
    document.getElementById('loadingOv').style.display = 'none';
  }
  
  S.busy = false;
  updateBtn();
}

// 创建试衣合成效果
async function createTryOnEffect(modelBase64, garmentBase64, category) {
  return new Promise((resolve) => {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 512;
    canvas.height = 768;
    
    const modelImg = new Image();
    const garmentImg = new Image();
    
    modelImg.onload = () => {
      // 绘制模特背景
      ctx.fillStyle = '#f5f5f5';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      // 绘制模特（居中，保持比例）
      const modelAspect = modelImg.width / modelImg.height;
      let mw = canvas.width * 0.9;
      let mh = mw / modelAspect;
      if (mh > canvas.height * 0.85) {
        mh = canvas.height * 0.85;
        mw = mh * modelAspect;
      }
      const mx = (canvas.width - mw) / 2;
      const my = (canvas.height - mh) / 2;
      
      // 添加阴影效果
      ctx.shadowColor = 'rgba(0,0,0,0.2)';
      ctx.shadowBlur = 20;
      ctx.shadowOffsetY = 10;
      ctx.drawImage(modelImg, mx, my, mw, mh);
      ctx.shadowColor = 'transparent';
      
      // 绘制服装叠加效果
      garmentImg.onload = () => {
        // 根据类别调整服装位置和大小
        let gw, gh, gx, gy;
        const garmentAspect = garmentImg.width / garmentImg.height;
        
        if (category === 'upper_body') {
          // 上装 - 放在上半身区域
          gw = mw * 0.5;
          gh = gw / garmentAspect;
          gx = mx + mw * 0.25;
          gy = my + mh * 0.15;
        } else if (category === 'lower_body') {
          // 下装 - 放在下半身区域
          gw = mw * 0.45;
          gh = gw / garmentAspect;
          gx = mx + mw * 0.275;
          gy = my + mh * 0.5;
        } else {
          // 连衣裙 - 覆盖全身
          gw = mw * 0.55;
          gh = gw / garmentAspect;
          gx = mx + mw * 0.225;
          gy = my + mh * 0.1;
        }
        
        // 绘制服装（带透明度和混合效果模拟AI合成）
        ctx.save();
        ctx.globalAlpha = 0.85;
        
        // 创建渐变遮罩模拟融合效果
        const gradient = ctx.createLinearGradient(gx, gy, gx, gy + gh);
        gradient.addColorStop(0, 'rgba(255,255,255,0.3)');
        gradient.addColorStop(0.5, 'rgba(255,255,255,0.1)');
        gradient.addColorStop(1, 'rgba(255,255,255,0.3)');
        
        ctx.drawImage(garmentImg, gx, gy, gw, gh);
        ctx.fillStyle = gradient;
        ctx.fillRect(gx, gy, gw, gh);
        
        ctx.restore();
        
        // 添加标签
        ctx.fillStyle = 'rgba(102, 126, 234, 0.9)';
        ctx.fillRect(10, 10, 120, 32);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px -apple-system, sans-serif';
        ctx.fillText('AI 虚拟试衣', 20, 32);
        
        resolve(canvas);
      };
      
      garmentImg.src = garmentBase64;
    };
    
    modelImg.src = modelBase64;
  });
}

// 文件选择
function pick(t) {
  S.curType = t;
  document.getElementById('fi').click();
}

document.getElementById('fi').addEventListener('change', function(e) {
  const f = e.target.files[0];
  if (!f) return;
  const t = S.curType;
  const r = new FileReader();
  r.onload = ev => {
    S.img[t] = ev.target.result;
    updateSlot(t);
    updateBtn();
  };
  r.readAsDataURL(f);
  e.target.value = '';
});

function updateSlot(t) {
  const sl = document.getElementById('slot-' + t);
  sl.classList.add('has-image');
  const lb = { model: '模特', garment: '服装' };
  sl.innerHTML = `<img src="${S.img[t]}"><button class="rm" onclick="event.stopPropagation();rm('${t}')">×</button><div class="tag">${lb[t]}</div>`;
}

function rm(t) {
  delete S.img[t];
  const sl = document.getElementById('slot-' + t);
  sl.classList.remove('has-image');
  const icons = { model: '🧍', garment: '👔' };
  sl.innerHTML = `<div style="font-size:36px;opacity:.5">${icons[t]}</div><div style="font-size:.8rem;color:#888">点击上传</div>`;
  updateBtn();
}

function updateBtn() {
  document.getElementById('genBtn').disabled = !(S.img.model && S.img.garment) || S.busy;
}

function selCategory(el, c) {
  document.querySelectorAll('.cat-btn').forEach(o => o.classList.remove('active'));
  el.classList.add('active');
  S.category = c;
}

function download() {
  const a = document.createElement('a');
  a.href = document.getElementById('resultImg').src;
  a.download = 'AI试衣-' + Date.now() + '.jpg';
  a.click();
}

function reset() {
  S.img = {};
  ['model', 'garment'].forEach(rm);
  document.getElementById('resultPh').style.display = 'flex';
  document.getElementById('resultContent').style.display = 'none';
  showToast('已重置', 'success');
}

function showToast(msg, type) {
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}
</script>
</body>
</html>
